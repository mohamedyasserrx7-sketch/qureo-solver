<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif}
.card{background:#111;border:1px solid #1e1e1e;border-radius:20px;padding:40px;width:340px}
h1{font-size:20px;color:#a3e635;font-weight:900;letter-spacing:2px;text-align:center;margin-bottom:6px}
p{font-size:11px;color:#64748b;text-align:center;letter-spacing:3px;margin-bottom:28px}
label{display:block;font-size:11px;color:#64748b;letter-spacing:1px;margin-bottom:6px}
input{width:100%;padding:12px 14px;background:#181818;border:1px solid #222;border-radius:10px;color:#e2e8f0;font-size:14px;outline:none;font-family:inherit}
input:focus{border-color:#a3e635}
button{margin-top:20px;width:100%;padding:14px;background:#a3e635;border:none;border-radius:12px;color:#000;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit}
#msg{margin-top:12px;font-size:13px;color:#f43f5e;text-align:center;min-height:18px}
</style>
</head>
<body>
<div class="card">
<h1>⚡ QUREO SOLVER</h1>
<p>PRIVATE ACCESS</p>
<label>كلمة السر</label>
<input id="pw" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/>
<button onclick="login()">دخول ←</button>
<div id="msg"></div>
</div>
<script>
async function login(){
const pw=document.getElementById('pw').value;
if(!pw)return;
const res=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
const d=await res.json();
if(d.ok){
localStorage.setItem('site-auth',d.token);
location.href='/';
}else{
document.getElementById('msg').textContent='كلمة السر غلط';
}
}
</script>
</body>
  </html>
